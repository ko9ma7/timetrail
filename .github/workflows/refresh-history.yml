name: Refresh historical data index

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: Maximum Wikidata records
        required: false
        default: '45000'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: history-data-refresh
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Harvest Wikidata
        env:
          MAX_HISTORY_RECORDS: ${{ inputs.max_records || '45000' }}
          WIKIDATA_USER_AGENT: TimeTrail/1.2 GitHub-Actions educational-map
        run: npm run data:refresh
      - name: Validate and build
        run: |
          npm run check
          npm run data:stats
          npm run build
      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data/history-events-index.json data/history-events-index.meta.json; then
            echo 'No data changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/history-events-index.json data/history-events-index.meta.json
            git commit -m 'data: refresh Wikidata historical index'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy refreshed data
        id: deployment
        uses: actions/deploy-pages@v4
